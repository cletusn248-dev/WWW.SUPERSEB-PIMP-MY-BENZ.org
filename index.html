  <!-- Instant redirect for crawlers/users without JS -->
  <noscript>

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; }
    .splash { position: fixed; inset: 0; width: 100%; height: 100dvh; overflow: hidden; background: #000; }
    .splash-image {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      object-fit: cover; object-position: center center;
      transform: scale(1); animation: luxuryZoom 10s ease-out forwards; will-change: transform;
    }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.16));
      pointer-events: none;
    }
    .loading-area {
      position: absolute; left: 22px; right: 22px;
      bottom: calc(28px + env(safe-area-inset-bottom));
      max-width: 430px; margin: 0 auto; z-index: 10;
    }
    .loading-info {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 9px; color: #d9aa50; font-size: 10px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
    }
    .progress-track { width: 100%; height: 2px; overflow: hidden; background: rgba(201, 150, 50, 0.20); }
    .progress-bar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #8f6722, #c99632, #f4c45f);
      box-shadow: 0 0 8px rgba(244, 196, 95, 0.55); transition: width 0.08s linear;
    }
    .gold-glow {
      position: absolute; left: 50%; bottom: calc(58px + env(safe-area-inset-bottom));
      width: 100px; height: 30px; transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(201, 150, 50, 0.13), transparent 70%);
      pointer-events: none;
    }
    /* Hidden but crawlable text for non-JS fallback context */
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    @keyframes luxuryZoom { from { transform: scale(1); } to { transform: scale(1.045); } }
    @media (max-width: 600px) {
      .splash-image { animation-name: mobileZoom; }
      .loading-area { left: 18px; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); }
    }
    @keyframes mobileZoom { from { transform: scale(1); } to { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .splash-image { animation: none; } }
  </style>
</head>
<body>
  <main class="splash" id="splash" aria-label="SUPERSEB PIMP MY BENZ">
    <h1 class="visually-hidden">SUPERSEB — Pimp My Benz: Mercedes-Benz Customization, Repairs &amp; Upgrades in Nigeria</h1>
    <img class="splash-image" src="images/splash-screen.png" alt="SUPERSEB PIMP MY BENZ — Mercedes-Benz customization and luxury upgrades in Nigeria" loading="eager" fetchpriority="high">
    <div class="overlay" aria-hidden="true"></div>
    <div class="gold-glow" aria-hidden="true"></div>
    <div class="loading-area" aria-label="Loading SUPERSEB">
      <div class="loading-info"><span id="loadingText">Loading</span><span id="loadingPercent">0%</span></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>
  </main>

  <script>
    (() => {
      const splashDuration = 3500;
      const maxWaitFallback = 6000; // hard stop: redirect even if rAF stalls (throttled/background tab)
      const nextPage = "home.html";
      const progressBar = document.getElementById("progressBar");
      const percentage = document.getElementById("loadingPercent");
      const loadingText = document.getElementById("loadingText");
      const startTime = performance.now();
      let redirected = false;

      function goHome() {
        if (redirected) return;
        redirected = true;
        window.location.replace(nextPage);
      }

      function updateSplash(currentTime) {
        if (redirected) return;
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / splashDuration, 1);
        const value = Math.floor(progress * 100);
        progressBar.style.width = value + "%";
        percentage.textContent = value + "%";
        if (value >= 90) loadingText.textContent = "Almost Ready";
        else if (value >= 50) loadingText.textContent = "Preparing";
        else loadingText.textContent = "Loading";
        if (progress >= 1) {
          loadingText.textContent = "Entering";
          percentage.textContent = "100%";
          setTimeout(goHome, 180);
          return;
        }
        requestAnimationFrame(updateSplash);
      }
      requestAnimationFrame(updateSplash);

      // Safety net: if rAF stalls (backgrounded tab, throttling), force the redirect anyway
      setTimeout(goHome, maxWaitFallback);
    })();
  </script>
</body>
</html>
